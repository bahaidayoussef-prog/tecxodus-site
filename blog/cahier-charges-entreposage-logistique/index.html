6-10-25","inLanguage":"fr-MA","author":{"@type":"Organization","name":"Tecxodus"},"publisher":{"@type":"Organization","name":"Tecxodus","url":"https://www.tecxodus.com/"},"mainEntityOfPage":{"@type":"WebPage","@id":"https://blog.tecxodus.com/cahier-charges-entreposage-logistique/"},"isPartOf":{"@type":"Blog","@id":"https://blog.tecxodus.com/#blog","name":"Blog Tecxodus","url":"https://blog.tecxodus.com/"},"breadcrumb":{"@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Accueil","item":"https://www.tecxodus.com/"},{"@type":"ListItem","position":2,"name":"Blog","item":"https://blog.tecxodus.com/"},{"@type":"ListItem","position":3,"name":"Cahier des charges d’entreposage : les informations à fournir à un prestataire","item":"https://blog.tecxodus.com/cahier-charges-entreposage-logistique/"}]}}</script><link rel="icon" type="image/svg+xml" href="/favicon.svg"><script async src="https://www.googletagmanager.com/gtag/js?id=G-YE0XFCRWNY"></script><script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-YE0XFCRWNY');</script></head><body><header class="wrap nav"><a class="brand" href="https://www.tecxodus.com/">tec<span style="color:#6c8b38">x</span>odus.</a><nav class="navlinks"><a href="https://www.tecxodus.com/#services">Services</a><a href="https://www.tecxodus.com/entreposage-casablanca/">Entreposage</a><a href="https://www.tecxodus.com/#simulateur">Simulateur</a><a href="https://blog.tecxodus.com/">Blog</a><a class="btn" href="https://www.tecxodus.com/#contact">Demander un devis ↗</a></nav></header><main class="wrap"><article class="article"><div class="crumb"><a href="https://blog.tecxodus.com/">Blog Tecxodus</a> / Achats et consultations · Cahier des charges</div><div class="tag">Achats et consultations · Cahier des charges</div><h1>Cahier des charges d’entreposage : les informations à fournir à un prestataire</h1><p class="lead">Un cahier des charges logistique utile décrit les flux réels, les tâches et la façon de mesurer le service. Il aide le prestataire à vérifier la faisabilité et permet à l’entreprise de comparer les prix sans laisser des hypothèses importantes dans l’ombre.</p><div class="article-content"><div class="answer"><strong>En bref.</strong> Incluez au minimum : profil des marchandises, stocks moyen et maximal, mouvements entrants et sortants, opérations, site, dates, données de suivi, exigences de qualité et grille tarifaire. Signalez ce qui reste à confirmer plutôt que de le transformer en promesse.</div>
<h2>1. Présenter l’entreprise et l’objectif</h2><p>Indiquez votre activité, les canaux de vente concernés et pourquoi vous consultez : démarrage, import ponctuel, débord de stock, saison, lancement produit ou externalisation durable. Précisez les tâches que vos équipes conserveront. Une courte description du résultat attendu aide le candidat à répondre au bon besoin.</p>
<h2>2. Décrire les produits et l’unité de stockage</h2><p>Fournissez une liste des références ou familles, avec dimensions, poids, conditionnement, codes-barres, quantités par carton et palettes types. Ajoutez les particularités documentées : fragilité, lot, date, incompatibilité de voisinage, valeur ou contrainte de manutention. Pour les besoins réglementés, joignez les fiches et prescriptions applicables et demandez une confirmation écrite de la capacité avant de retenir un site.</p>
<h2>3. Quantifier les flux sans masquer les pointes</h2><p>Un seul chiffre moyen ne suffit pas. Donnez le stock moyen, le stock maximal, la durée envisagée, les réceptions par semaine ou mois, les palettes et colis par réception, le nombre de commandes et de lignes, ainsi que les sorties groupées. Distinguez le mois ordinaire, le pic et la baisse. Si vous démarrez, fournissez plusieurs scénarios et marquez-les comme prévisions.</p>
<h2>4. Définir chaque opération et son résultat attendu</h2><ul><li>Réception : rendez-vous, déchargement, contrôle visuel ou quantitatif demandé, traitement des écarts.</li><li>Stockage : unité facturée, règles de comptage, inventaires, accès et restitution des données.</li><li>Préparation : commande ou ligne, multi-références, emballage, étiquetage et preuve de sortie.</li><li>Services campagne : kit, assemblage, copacking, fardelage, PLV, contrôle d’échantillon, versions et destinations.</li><li>Expédition : mise à disposition ou transport, zones couvertes, responsabilités et preuve de livraison à préciser.</li></ul><p>La prestation « contrôle » doit indiquer ce qui est vérifié, sur quelle base et comment les non-conformités sont signalées. Le nom d’une tâche ne définit pas son niveau d’engagement.</p>
<h2>5. Fixer calendrier, données et niveau de service</h2><p>Établissez les dates d’arrivée, le démarrage souhaité, les jours et horaires de traitement, les délais d’annonce et les échéances de campagne. Pour un SLA, définissez le moment de départ du délai, le moment de fin, le dénominateur, les jours ouvrés et les exceptions. Demandez quels indicateurs et justificatifs peuvent être transmis. Pour les échanges informatiques, précisez formats, identifiants, fréquence et responsable de chaque fichier.</p>
<h2>6. Joindre une grille de prix comparable</h2><p>Demandez le prix et l’unité pour la réception, le stockage, la préparation, les consommables, le copacking, les inventaires, le démarrage et les éventuels transports. Pour chaque ligne, faites noter le minimum, la périodicité, les inclusions, les exclusions, taxes, hypothèses de volume et modalités de révision. Comparez les réponses à mêmes hypothèses ; consultez <a href="../formules-prix-prestation-logistique/">les formules de prix logistique</a> et <a href="../cout-stockage-externalise-logistique/">les postes du coût de stockage</a>.</p>
<h2>7. Préparer l’évaluation des candidats</h2><p>Évaluez la conformité, la faisabilité, le coût total dans plusieurs scénarios, la qualité, la visibilité du stock, le plan de transition et la gestion des incidents. Notez les réserves et questions ouvertes dans un tableau. Un prix bas qui suppose une capacité, une prestation ou un délai absent du dossier n’est pas une comparaison à périmètre égal.</p>
<p>Si l’achat est un marché public, le dossier de consultation et la réglementation applicable priment sur toute trame générique. Le décret n° 2-22-431 demande notamment une définition précise du besoin et des spécifications, et une estimation adaptée à la prestation. Pour un appel d’offres public en cours, utilisez les documents officiels et leurs éventuels rectificatifs.</p>
<p>Pour un petit stock ou une activité non logistique, décrivez aussi le niveau d’accompagnement attendu : interlocuteur, inventaire de départ, fréquence de reporting et gestion des variations. Le guide <a href="../inventaire-initial-externaliser-stock/">préparer l’inventaire initial</a> aide à structurer cette étape.</p><p><small>Mis à jour le 25 octobre 2026. Les tarifs, délais, capacités et périmètres doivent être confirmés par une proposition écrite liée au besoin réel.</small></p><h2>Sources officielles et méthode</h2><ul><li><a href="https://www.tgr.gov.ma/wps/wcm/connect/1f3081fc-2d01-41de-8339-9a2c7de0480f/DECRET%2B2-22-431%2BFR.pdf?MOD=AJPERES">Trésorerie Générale du Royaume : décret n° 2-22-431 relatif aux marchés publics</a> (pour les procédures publiques relevant de son champ).</li><li><a href="https://www.marchespublics.gov.ma/">Portail Marocain des Marchés Publics</a> (avis, consultations et dossiers publiés).</li></ul></div><aside class="related"><h2>À lire aussi</h2><ul><li><a href="../appel-offres-logistique-maroc/">Répondre à une consultation logistique</a></li><li><a href="../devis-entreposage-informations-necessaires/">Obtenir un devis d’entreposage exploitable</a></li><li><a href="../comparer-offres-prestataires-logistiques-perimetre/">Comparer les offres à périmètre égal</a></li><li><a href="../contrat-entreposage-clauses-operationnelles/">Contrat d’entreposage : clauses opérationnelles</a></li></ul></aside><section class="cta"><strong>Vous avez un cahier des charges, même provisoire ? Tecxodus peut examiner les volumes, les opérations et le calendrier pour étudier une solution à Casablanca.</strong><p>La faisabilité, les délais et les tarifs sont confirmés après examen des produits et des flux.</p><a href="https://www.tecxodus.com/entreposage-casablanca/#contact">Soumettre votre besoin ↗</a><br><a href="https://wa.me/212663449200?text=Bonjour%20Tecxodus%2C%20j%E2%80%99ai%20un%20besoin%20d%E2%80%99entreposage%20et%20souhaite%20savoir%20quelles%
