">Pour comparer des offres logistiques, transformez d’abord le besoin en unités mesurables : palettes entrantes, jours de stockage, lignes préparées, commandes, opérations de copacking et livraisons. Le prix n’est comparable que si les hypothèses, les exclusions, les délais et le niveau de service sont les mêmes.</p><div class="article-content"><div class="answer"><strong>Réponse rapide.</strong> Une consultation logistique solide décrit les marchandises, les volumes moyens et de pointe, les opérations attendues, les lieux, le calendrier, les données à échanger, les niveaux de service et la grille de prix. Demandez à chaque candidat de chiffrer le même scénario de base et le même scénario de pointe.</div>
<h2>Public ou privé : commencer par identifier la procédure</h2>
<p>Une consultation d’entreprise privée et un marché public ne suivent pas automatiquement le même cadre. Pour un marché entrant dans le champ des marchés publics marocains, le dossier et les règles applicables doivent être lus dans leur version en vigueur. Le décret marocain n° 2-22-431 encadre notamment la définition du besoin, l’estimation du coût et les pièces de la procédure ; il ne faut pas transposer ces règles à une consultation privée sans vérifier le contexte. La <a href="https://www.marchespublics.gov.ma/">plateforme marocaine des marchés publics</a> publie des avis et dossiers de consultation.</p>
<p>Pour un appel d’offres public, le règlement de consultation, le cahier des prescriptions spéciales, les modèles de réponse, les rectificatifs et les délais de dépôt priment. Vérifiez les critères de recevabilité, les pièces, la signature demandée et les modalités de remise avant de travailler le prix. Si une clause est ambiguë, utilisez le canal et le délai de demande d’éclaircissement prévus au dossier.</p>
<h2>Construire une base commune pour tous les candidats</h2>
<ul><li><strong>Produits :</strong> famille, dimensions, poids, fragilité, lots, dates et contraintes documentées.</li><li><strong>Flux :</strong> stock moyen et pic, réceptions par période, commandes, lignes par commande, retours et sorties exceptionnelles.</li><li><strong>Prestations :</strong> déchargement, contrôle convenu, rangement, inventaire, préparation, emballage, étiquetage, copacking, filmage, mise à disposition et transport si demandé.</li><li><strong>Géographie et calendrier :</strong> sites, destinations, dates de démarrage, horaires, saisonnalité et durée estimée.</li><li><strong>Information :</strong> format de fichiers, fréquence de mise à jour, interlocuteurs, preuves de traitement et règles de correction des écarts.</li></ul>
<p>Un brief commun permet de comparer les réponses sur un même périmètre. Pour préparer le document, utilisez aussi notre <a href="../cahier-charges-entreposage-logistique/">trame de cahier des charges d’entreposage</a>.</p>
<h2>Évaluer le coût complet et les engagements</h2>
<p>Demandez une décomposition par unité : entrée palette ou colis, position-jour ou position-mois, sortie, ligne ou commande préparée, inventaire, consommable, opération spéciale et transport. Faites préciser les minimums de facturation, les périodes de stockage, les arrondis, les frais de démarrage, les conditions de révision et les prestations hors forfait.</p>
<p>Comparez ensuite les réponses à volumes identiques : mois normal, pic et baisse. Évaluez séparément la qualité de l’exécution, la traçabilité, les responsabilités sur les écarts, la capacité annoncée, le plan de démarrage et les indicateurs de service. Un délai ou un taux de service n’est utile que s’il a une définition, un point de départ, une méthode de mesure et des exclusions écrites.</p>
<p>Pour une consultation publique, l’article 6 du décret n° 2-22-431 demande au maître d’ouvrage d’établir une estimation du coût à partir de la consistance des prestations, des prix du marché et des conditions d’exécution. Cette estimation relève de l’acheteur : le soumissionnaire doit répondre au dossier et à ses pièces, pas présenter une estimation illustrative comme un barème officiel.</p>
<h2>Reconnaître une offre réellement comparable</h2>
<p>Créez une matrice avec quatre colonnes : exigence, réponse du candidat, preuve ou réserve, impact tarifaire. Toute ligne non renseignée devient une question à résoudre avant attribution. Pour une activité avec volumes très variables, comparez un modèle à prix unitaires, un prix fermé et, si proposé, une base ouverte. Définissez alors les données accessibles, les coûts éligibles, la marge, les règles d’audit et le plafond ou mécanisme d’ajustement. Voir le guide <a href="../open-book-closed-book-logistique/">open book ou closed book en logistique</a>.</p>
<h2>À préparer avant l’envoi</h2><ol><li>Un historique de flux anonymisé ou une estimation explicitement qualifiée.</li><li>Un scénario normal et un scénario de pointe.</li><li>Une grille de prix à remplir, avec unités et périodes explicites.</li><li>Les critères de choix et les questions à poser à chaque candidat.</li><li>Les hypothèses de démarrage et la liste des décisions encore ouvertes.</li></ol>
<p>Le décret et le portail cités concernent les marchés publics. Pour une consultation privée, le cahier des charges et les règles de l’entreprise restent à examiner. Les exigences réglementaires ou contractuelles propres à la marchandise doivent être vérifiées auprès des interlocuteurs compétents.</p><p><small>Mis à jour le 25 octobre 2026. Les tarifs, délais, capacités et périmètres doivent être confirmés par une proposition écrite liée au besoin réel.</small></p><h2>Sources officielles et méthode</h2><ul><li><a href="https://www.tgr.gov.ma/wps/wcm/connect/1f3081fc-2d01-41de-8339-9a2c7de0480f/DECRET%2B2-22-431%2BFR.pdf?MOD=AJPERES">Trésorerie Générale du Royaume : décret n° 2-22-431 relatif aux marchés publics</a> (pour les procédures publiques relevant de son champ).</li><li><a href="https://www.marchespublics.gov.ma/">Portail Marocain des Marchés Publics</a> (avis, consultations et dossiers publiés).</li></ul></div><aside class="related"><h2>À lire aussi</h2><ul><li><a href="../cahier-charges-entreposage-logistique/">Cahier des charges d’entreposage : la trame</a></li><li><a href="../open-book-closed-book-logistique/">Open book ou closed book</a></li><li><a href="../comparer-offres-prestataires-logistiques-perimetre/">Comparer des offres logistiques à périmètre égal</a></li><li><a href="../devis-entreposage-informations-necessaires/">Préparer un devis d’entreposage</a></li></ul></aside><section class="cta"><strong>Vous préparez une consultation ou une externalisation ? Envoyez votre périmètre, vos volumes et votre calendrier pour étudier la faisabilité à Casablanca.</strong><p>La faisabilité, les délais et les tarifs sont confirmés après examen des produits et des flux.</p><a href="https://www.tecxodus.com/entreposage-casablanca/#contact">Présenter votre besoin à Tecxodus ↗</a><br><a href="https://wa.me/212663449200?text=Bonjour%20Tecxodus%2C%20je%20pr%C3%A9pare%20une%20consultation%20logistique%20et%20souhaite%20v%C3%A9rifier%20le%20p%C3%A9rim%C3%A8tre%20et%20l
